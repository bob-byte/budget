name: budget
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.3.0
  cupertino_icons: ^1.0.9
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter_hooks: ^0.21.3+1
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  hooks_riverpod: ^3.3.1
  launcher_name: ^1.0.2
  logger: ^2.7.0
  sign_button: ^2.0.6
  url_launcher: ^6.3.2
  url_strategy: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

launcher_name:
  default: "Budget"
  uk: "Бюджет"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/logo.png
  web:
    generate: true
    image_path: assets/logo.png
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: assets/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/logo.png
